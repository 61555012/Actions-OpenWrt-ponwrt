# oaf-lite 本地补充特征库
#
# 官方 feature.cfg 只有 500 多条规则，覆盖的是「协议特征」而不是「真实域名」。
# 现在大流量几乎全走 CDN，douyinstatic / xhscdn / bdstatic 这类域名官方库里
# 一条都没有，于是几十 GB 的下载全部落进「未识别」——实测 72 个真实域名只
# 命中 12 个，识别率 17%。
#
# 这里只做一件事：给「已有 id」追加域名后缀。解析器按 id 合并，重复的
# add_name 会被跳过，所以应用名、分类、图标都不变，官方规则也不会被覆盖。
# 后缀匹配是按点边界的，写 github.com 就等于覆盖 *.github.com。
#
# 改完重启生效： /etc/init.d/oaf-lite restart

