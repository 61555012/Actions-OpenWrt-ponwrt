# 040G-MD 纯净版（PonWrt 源码）构建流水线
# 与 build-040g-ponwrt-full.yml（标准版）、build-040g-lede-lite.yml（LEDE 纯净版）并列，互不影响
#
# 目标源码: pbs05/ponwrt (master)
# 机型:     Nokia XG-040G-MD (UBI) / airoha an7581
# 配置:     ponwrt 官方 configs/an7581.config + configs/release.config 作基线，
#           仓库根 .config-ponwrt-lite 作叠加层
# DIY:      diy-ponwrt-lite-1.sh(改 feeds) / diy-ponwrt-lite-2.sh(内核统计 + 去 dummy + 首启默认值 + root 密码)
# 落地文件: 无 —— 纯净版【不引用仓库 files/】，出厂默认值全部由 diy-ponwrt-lite-2.sh 在构建期写进源码树
#           （不带实机 PPPoE 账号、不带个人密码、不带 UPnP/OAF 配置）
#           默认 root 密码: admin123
#
# 纯净版 = 只保留"光口能起来 + 硬件加速转发"所需的最小集合:
#   ✓ PON 驱动栈 + 光模块驱动 EN7572      (全部 =y)
#   ✓ 2.5G PHY EN8811H 驱动与固件          (全部 =y)
#   ✓ fw4 flowtable(L2 桥接 + L3) + PPE 硬件加速
#   ✓ 每流字节统计 CONFIG_NET_AIROHA_FLOW_STATS=y
#   ✓ luci-app-onu / luci-app-pon-status（配置注册用，非可选插件）
#   ✓ 无 dummy 接口   ✓ 默认 root 密码 admin123
#   ✗ argon 主题  ✗ OAF  ✗ mosdns v5  ✗ UPnP  ✗ NPU 面板  ✗ htop/nano  ✗ 仓库 files/ 覆盖层
#
# 与标准版 / LEDE 纯净版的产物区分:
#   Release tag 前缀 ponwrt-lite-040g-md-（标准版是 040g-md-，LEDE 纯净版是 lede-lite-040g-md-）
# 工具链缓存与标准版共用同一个 key（toolchain-airoha-an7581-*），可直接复用已编好的工具链。
#

name: 040G-MD 纯净版 (PonWrt)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接调试'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

# 与标准版共用 toolchain-cache 这个 Release，避免两个工作流同时写缓存
concurrency:
  group: ponwrt-toolchain-cache
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/pbs05/ponwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config-ponwrt-lite
  DIY_P1_SH: diy-ponwrt-lite-1.sh
  DIY_P2_SH: diy-ponwrt-lite-2.sh
  ROOT_PASS: admin123
  UPLOAD_RELEASE: true
  DEVICE_NAME: ponwrt-lite-040g-md
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # runner 只有 73G 磁盘, 编译期必然吃满; 先把镜像里用不到的大件清干净
        # (android sdk / dotnet / ghc / hostedtoolcache / boost / swift / ghcup / docker 镜像)
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
                    /opt/microsoft /usr/local/lib/node_modules /opt/az /usr/local/aws-cli || true
        sudo docker image prune --all --force
        sudo docker system prune -af --volumes || true
        sudo rm -rf /var/lib/apt/lists/*
        echo "----- 清理后磁盘 -----"; df -hT /
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds / DIY part 1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Kernel tweaks / DIY part 2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd openwrt
        # 纯净版不合并仓库 files/，固件只带上游默认配置 + diy-ponwrt-lite-2.sh 写入的出厂默认值
        # 1) 官方基线: ponwrt 自带 configs/an7581.config + configs/release.config
        #    （含 UBIFS / initramfs / squashfs / 内核参数等镜像级设置，手写种子缺失会编出不能启动的镜像）
        ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
        # 2) 只编本机: 去掉其它机型的 DEVICE 选择，保留官方 MULTI_PROFILE 模式
        sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
        echo 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' >> .config
        # 3) 叠加纯净版的 .config-ponwrt-lite
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        make defconfig
        echo "===== 目标相关行 ====="
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|MULTI_PROFILE)=' .config
        grep -E 'nokia_xg-040g-md-ubi=y$' .config || true
        # ---- ccache: 编译器对象缓存, 跨构建复用已编译的 .o ----
        # Config.in / Config-build.in 里没有 "config CCACHE" 这个符号, 探测式永远不成立
        # (实测连续几轮都是 warning)。rules.mk 判的是 make 变量 CONFIG_CCACHE,
        # 直接写进 .config 即可, 但不要紧跟 make defconfig —— kconfig 认不得这个符号, 会把它清掉。
        # 可用性由后面的 Handle toolchain 校验: ccache 起不来就删掉这行并回退。
        if ! grep -q '^CONFIG_CCACHE=y' .config; then
          echo 'CONFIG_CCACHE=y' >> .config
        fi
        if grep -q '^CONFIG_CCACHE=y' .config; then
          echo "✅ CONFIG_CCACHE 已启用（host ccache 在工具链阶段校验）"
        else
          echo "::warning::CONFIG_CCACHE 未生效，本次不使用 ccache（不影响构建）"
        fi

    - name: Verify target device
      run: |
        cd openwrt
        BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUB=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
        DEV=$(grep -oE '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia[^=]*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/')
        [ -n "$DEV" ] || DEV=$(grep -oE '^CONFIG_TARGET_airoha_an7581_DEVICE_nokia[^=]*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/')
        echo "board=$BOARD subtarget=$SUB device=$DEV"
        if [ "$BOARD" != "airoha" ] || [ "$SUB" != "an7581" ]; then
          echo "❌ 目标不符: 期望 airoha/an7581, 实际 $BOARD/$SUB"; exit 1
        fi
        if [ "$DEV" != "nokia_xg-040g-md-ubi" ]; then
          echo "❌ 设备不符: 期望 nokia_xg-040g-md-ubi, 实际 '$DEV'"
          grep -E 'nokia' .config || true
          exit 1
        fi
        echo "✅ 目标校验通过: airoha/an7581/$DEV"

    - name: Verify PON / 2.5G / accel (lite)
      run: |
        cd openwrt
        ok=1
        need() {
          if grep -qE "^$1=[ym]$" .config; then echo "✅ $1";
          else echo "❌ 缺少 $1"; ok=0; fi
        }
        # 必须编进内核镜像(=y)，不能是 =m 外挂模块
        needy() {
          if grep -qE "^$1=y$" .config; then echo "✅ $1=y";
          else echo "❌ $1 不是 =y（当前: $(grep -E "^$1=" .config || echo '未出现')）"; ok=0; fi
        }
        # 纯净版必须【不存在】
        absent() {
          if grep -qE "^$1=[ym]$" .config; then
            echo "❌ 纯净版不应包含 $1（当前: $(grep -E "^$1=" .config)）"; ok=0
          else
            echo "✅ 已排除 $1"
          fi
        }
        echo "----- PON 驱动栈 / 光模块驱动（强制 =y）-----"
        needy CONFIG_PACKAGE_kmod-airoha-xpon
        needy CONFIG_PACKAGE_kmod-airoha-pon-frontend
        needy CONFIG_PACKAGE_kmod-airoha-en7572
        needy CONFIG_PACKAGE_airoha-pond
        needy CONFIG_PACKAGE_airoha-ponctl
        echo "----- 2.5G 网口 PHY EN8811H（强制 =y）-----"
        needy CONFIG_PACKAGE_kmod-phy-airoha-en8811h
        needy CONFIG_PACKAGE_airoha-en8811h-firmware
        echo "----- 硬件加速 (L2 桥接 / L3) -----"
        need CONFIG_PACKAGE_kmod-nf-conntrack-bridge
        need CONFIG_PACKAGE_kmod-nft-offload
        need CONFIG_PACKAGE_kmod-nf-flow
        echo "----- 内核开关: 每流统计 -----"
        if grep -qE '^CONFIG_NET_AIROHA_FLOW_STATS=y' target/linux/airoha/an7581/config-6.18; then
          echo "✅ CONFIG_NET_AIROHA_FLOW_STATS=y (config-6.18 已改写)"
        else
          echo "❌ CONFIG_NET_AIROHA_FLOW_STATS 未在 config-6.18 中打开"; ok=0
        fi
        echo "----- 基础管理界面 -----"
        need CONFIG_PACKAGE_luci-app-onu
        need CONFIG_PACKAGE_luci-app-pon-status
        need CONFIG_PACKAGE_luci-theme-bootstrap
        echo "----- 纯净版排除项（argon / OAF / mosdns / UPnP / NPU 面板）-----"
        absent CONFIG_PACKAGE_luci-theme-argon
        absent CONFIG_PACKAGE_luci-app-argon-config
        absent CONFIG_PACKAGE_kmod-oaf
        absent CONFIG_PACKAGE_appfilter
        absent CONFIG_PACKAGE_luci-app-oaf
        absent CONFIG_PACKAGE_mosdns
        absent CONFIG_PACKAGE_luci-app-mosdns
        absent CONFIG_PACKAGE_geo2txt
        absent CONFIG_PACKAGE_luci-app-upnp
        absent CONFIG_PACKAGE_miniupnpd-nftables
        absent CONFIG_PACKAGE_luci-app-airoha-npu
        echo "----- dummy 接口已排除 -----"
        if grep -qE '^CONFIG_PACKAGE_kmod-dummy=[ym]' .config; then
          echo "❌ kmod-dummy 仍被选中"; ok=0
        else
          echo "✅ kmod-dummy 未选中"
        fi
        echo "----- 出厂默认值（构建期写入源码树，不依赖仓库 files/）-----"
        if grep -qE '^root:[^:]+:' package/base-files/files/etc/shadow; then
          echo "✅ root 密码已设置（$(grep -m1 '^root:' package/base-files/files/etc/shadow | cut -c6-9)... 哈希）"
        else
          echo "❌ root 密码未设置"; ok=0
        fi
        if [ -f package/base-files/files/etc/uci-defaults/99-lite-bridge ]; then
          echo "✅ 首启默认值 uci-defaults/99-lite-bridge 已生成"
          grep -q "flow_offloading_hw='1'" package/base-files/files/etc/uci-defaults/99-lite-bridge \
            && echo "   → flow_offloading_hw=1" || { echo "❌ uci-defaults 未打开硬件加速"; ok=0; }
        else
          echo "❌ 缺少 uci-defaults/99-lite-bridge"; ok=0
        fi
        echo "----- 未引用仓库 files/ -----"
        if [ -d "$GITHUB_WORKSPACE/files" ] && [ -d files ] && [ "$(ls -A files 2>/dev/null)" ]; then
          echo "⚠️  openwrt/files 非空（应只由 diy 脚本写入）"
          ls -R files | head -20
        else
          echo "✅ openwrt/files 为空，固件不含仓库覆盖层"
        fi
        if [ "$ok" != "1" ]; then echo "❌ 校验失败, 终止编译"; exit 1; fi
        echo "✅ 全部校验通过"

    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
        echo "CACHE_KEY=toolchain-airoha-an7581-${TOOLS_HASH:0:16}" >> $GITHUB_OUTPUT
        echo "CACHE_PREFIX=toolchain-airoha-an7581" >> $GITHUB_OUTPUT
        echo "缓存键: toolchain-airoha-an7581-${TOOLS_HASH:0:16}"
        # ---- 二次利用: dl 源码包 + ccache 的缓存键 ----
        # dl 按月轮转 / ccache 按 ISO 周轮转: 同周期内精确命中即不重复保存,
        # 避免每次构建都写一条新缓存把 10GB 配额挤爆、反过来淘汰工具链缓存。
        echo "CACHE_TAG=airoha-an7581" >> $GITHUB_OUTPUT
        echo "DL_KEY=dl-airoha-an7581-$(date -u +%Y%m)" >> $GITHUB_OUTPUT
        echo "CC_KEY=ccache-airoha-an7581-$(date -u +%G-W%V)" >> $GITHUB_OUTPUT
        echo "dl 键: dl-airoha-an7581-$(date -u +%Y%m)  ccache 键: ccache-airoha-an7581-$(date -u +%G-W%V)"

    - name: Restore toolchain (actions/cache)
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Restore toolchain (Release backup)
      if: steps.cache-restore.outputs.cache-hit != 'true'
      id: release-restore
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        ASSET="${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "toolchain-cache 不存在, 首次运行"
          exit 0
        fi
        if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
          gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D .
          if [ -e "$ASSET" ]; then
            tar -I unzstd -xf "$ASSET" || tar -xf "$ASSET"
            rm -f "$ASSET"
            echo "restored=true" >> $GITHUB_OUTPUT
            echo "Release 工具链恢复成功"
          else
            echo "restored=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "Release 中无该缓存: $ASSET"
        fi

    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt
        if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
          echo "actions/cache 命中, 跳过工具链编译"
          echo "save_cache=false" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        elif [ "${{ steps.release-restore.outputs.restored }}" = "true" ]; then
          echo "Release 缓存命中, 回写 actions/cache"
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        else
          echo "无缓存, 开始编译工具链..."
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=true" >> $GITHUB_OUTPUT
        fi
        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile
        echo "Makefile 已修改: 后续跳过工具链重编译"
        # ---- ccache: PATH 与 staging 两个通道都要通, 否则回退关闭 ----
        # 1) rules.mk:  TARGET_CC := ccache $(TARGET_CC)                         → 走 PATH
        # 2) cmake.mk:  -DCMAKE_C_COMPILER_LAUNCHER=$(STAGING_DIR_HOST)/bin/ccache → 绝对路径
        # 上一版只校验 PATH, 结果 cmake 包 (libnl-tiny / fwtool 等) 编译期报
        #   /bin/sh: .../staging_dir/host/bin/ccache: not found  → Error 127
        if grep -q '^CONFIG_CCACHE=y' .config 2>/dev/null; then
          SYSCC=$(command -v ccache 2>/dev/null || true)
          mkdir -p staging_dir/host/bin
          if [ ! -x staging_dir/host/bin/ccache ]; then
            if [ -n "$SYSCC" ]; then
              echo "补 staging ccache: $SYSCC -> staging_dir/host/bin/ccache (cmake.mk 需要该绝对路径)"
              ln -sf "$SYSCC" staging_dir/host/bin/ccache 2>/dev/null \
                || cp -f "$SYSCC" staging_dir/host/bin/ccache 2>/dev/null || true
            else
              echo "PATH 上没有 ccache, 尝试 make tools/ccache/install ..."
              make tools/ccache/install -j$(nproc) >/dev/null 2>&1 || true
            fi
          fi
          if [ -x staging_dir/host/bin/ccache ]; then
            # rules.mk 里 CCACHE_DIR 默认 $(TOPDIR)/.ccache, 与 actions/cache 的路径一致
            export CCACHE_DIR="$PWD/.ccache"
            mkdir -p "$CCACHE_DIR"
            staging_dir/host/bin/ccache --max-size=1G >/dev/null 2>&1 || true
            echo "✅ ccache 可用 (PATH + staging 双通道均已满足):"
            staging_dir/host/bin/ccache --version | head -1 || true
            staging_dir/host/bin/ccache -s | head -8 || true
          else
            echo "::warning::ccache 不可用 (staging_dir/host/bin/ccache 缺失且无法补齐), 回退关闭 CONFIG_CCACHE"
            sed -i '/^CONFIG_CCACHE/d' .config
            echo '# CONFIG_CCACHE is not set' >> .config
            make defconfig
          fi
        fi

    - name: Save toolchain (actions/cache)
      uses: actions/cache/save@v4
      if: steps.toolchain.outputs.save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Save toolchain (Release backup)
      if: steps.toolchain.outputs.save_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"
        tar -I zstdmt -cf "${KEY}.tzst" staging_dir/host* staging_dir/tool*
        ls -lh "${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" --title "Toolchain Cache" --notes "自动生成的工具链缓存, 请勿删除" --latest=false
        fi
        gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep "^${PREFIX}" | while read -r old; do
          echo "删除旧缓存: $old"
          gh release delete-asset toolchain-cache "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
        done
        gh release upload toolchain-cache "${KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
        rm -f "${KEY}.tzst"

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true'

    - name: Restore dl cache (源码包)
      uses: actions/cache@v4
      id: dl-cache
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.cache-key.outputs.DL_KEY }}
        restore-keys: |
          dl-airoha-an7581-

    - name: Restore ccache (编译对象缓存)
      uses: actions/cache@v4
      id: ccache-cache
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ steps.cache-key.outputs.CC_KEY }}
        restore-keys: |
          ccache-airoha-an7581-

    - name: Report cache state
      run: |
        cd openwrt
        echo "dl 命中: ${{ steps.dl-cache.outputs.cache-hit }} / ccache 命中: ${{ steps.ccache-cache.outputs.cache-hit }}"
        du -sh dl 2>/dev/null || echo "dl 尚不存在"
        # Go 模块缓存 (dl/go-mod-cache) 不要跨构建复用。
        # 实证: run 41485399379 / 41397272479 没有 dl 缓存时 mosdns 5.3.4 编译通过;
        # run 41485388868 恢复了含 go-mod-cache 的 dl 缓存, package/mosdns/mosdns
        # 进 compile 5 秒就 failed to build (GOMODCACHE 里是别的构建留下的模块集)。
        # 删掉最稳: Go 包会在线重取, 多花 1~2 分钟, 换掉一类难查的秒失败。
        if [ -d dl/go-mod-cache ]; then
          echo "丢弃 dl/go-mod-cache ($(du -sh dl/go-mod-cache | cut -f1)), Go 包改为在线取模块"
          rm -rf dl/go-mod-cache
        fi
        du -sh .ccache 2>/dev/null || echo ".ccache 尚不存在"
        df -hT / | tail -1

    - name: Download package
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        df -hT /
        # 原写法 make -j || make -j1 || make -j1 V=s: 磁盘写满时也会重试两次, 白耗十几分钟
        set +e
        make -j$(nproc) 2>&1 | tee /tmp/build.log
        rc=${PIPESTATUS[0]}
        set -e
        if [ "$rc" -ne 0 ]; then
          if grep -qE 'No space left on device|running out of disk space' /tmp/build.log; then
            echo "::error::磁盘写满 (ENOSPC), 编译中断; 重试只会继续失败"
            df -hT /
            exit 1
          fi
          # -j 的 trace 输出会把真正的错误行淹掉、甚至不落盘, 必须 -j1 V=s 重跑才拿得到原因。
          # 重跑只补做失败的那几个包 (stamp 都在), 一般几分钟, 不会重来两小时。
          echo "::warning::首次编译失败 (非磁盘原因), 用 -j1 V=s 抓详细错误"
          set +e
          make -j1 V=s > /tmp/build2.log 2>&1
          rc=$?
          set -e
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::编译失败"
          echo "===== 关键错误行 ====="
          grep -nE '(^|[[:space:]])(ERROR:|Error [0-9]+|error:|\*\*\* |No such file|Cannot |undefined reference|command not found)' /tmp/build2.log 2>/dev/null | tail -50 || true
          echo "===== 失败包上下文 ====="
          grep -nE 'make\[[0-9]+\].*(Error|\*\*\*)' /tmp/build2.log 2>/dev/null | tail -20 || true
          echo "===== 磁盘 ====="
          df -hT / || true
          echo "===== 末尾 150 行 ====="
          tail -150 /tmp/build2.log 2>/dev/null || tail -150 /tmp/build.log
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-ponwrt-lite
        path: |
          /tmp/build.log
          /tmp/build2.log
        if-no-files-found: ignore
        retention-days: 3

    - name: Verify built kernel config
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        KCFG=$(ls -d build_dir/target-*/linux-airoha_an7581/linux-*/.config 2>/dev/null | head -1)
        echo "kernel config: $KCFG"
        if [ -n "$KCFG" ]; then
          for sym in CONFIG_NET_AIROHA_FLOW_STATS CONFIG_NET_AIROHA CONFIG_NF_FLOW_TABLE CONFIG_NFT_FLOW_OFFLOAD; do
            echo "$(grep -E "^${sym}=" "$KCFG" || echo "$sym <未设置>")"
          done
          grep -qE '^CONFIG_NET_AIROHA_FLOW_STATS=y' "$KCFG" \
            && echo "✅ 内核已编入每流统计" \
            || echo "⚠️  CONFIG_NET_AIROHA_FLOW_STATS 未生效(检查 Kconfig 依赖)"
        fi
        echo "===== PPE TCP_FIN 老化时间 (补丁应已生效: 30s) ====="
        PSRC=$(ls -d build_dir/target-*/linux-airoha_an7581/linux-*/drivers/net/ethernet/airoha/airoha_ppe.c 2>/dev/null | head -1)
        if [ -n "$PSRC" ]; then
          grep -nE 'FIELD_PREP\(PPE_BIND_AGE1_DELTA_TCP_FIN,' "$PSRC" | sed 's/^/  /'
          if grep -qE 'PPE_BIND_AGE1_DELTA_TCP_FIN, 30\)' "$PSRC"; then
            echo "✅ TCP_FIN 老化已改为 30s (条目在 FIN 后多留 30s, 流量统计能取到终值)"
          else
            echo "❌ TCP_FIN 老化补丁未生效: 内核里还是 1s, 秒级大流量的统计会明显偏低"
            exit 1
          fi
        else
          echo "⚠️  找不到已解包的 airoha_ppe.c, 跳过检查"
        fi
        echo "===== 镜像体积（纯净版应明显小于标准版）====="
        ls -lh bin/targets/airoha/an7581/*.itb bin/targets/airoha/an7581/*.bin 2>/dev/null || true

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=${DEVICE_NAME}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT
        {
          echo "## PonWrt 纯净版固件 (Nokia XG-040G-MD)"
          echo ""
          echo "| 项目 | 详情 |"
          echo "|------|------|"
          echo "| 源码 | $REPO_URL ($REPO_BRANCH) |"
          echo "| 设备 | airoha/an7581 / nokia_xg-040g-md-ubi |"
          echo "| 定位 | 纯净版: 仅光口 + 硬件加速转发，无第三方插件 |"
          echo "| 硬件加速 | fw4 flowtable(L2+L3) + PPE, 默认 flow_offloading=1 |"
          echo "| 每流统计 | CONFIG_NET_AIROHA_FLOW_STATS=y |"
          echo "| PON | airoha-xpon + pon-frontend + en7572 |"
          echo "| 2.5G | phy-airoha-en8811h (lan1) |"
          echo "| 主题 | luci-theme-bootstrap（不含 argon）|"
          echo "| 已排除 | argon / OAF / mosdns / UPnP / NPU 面板 |"
          echo "| 出厂配置 | 不含仓库 files/ 覆盖层，默认 root 密码 \`admin123\` |"
          echo "| 时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |"
        } > release.txt

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.itb
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
        delete_tag_pattern: '^ponwrt-lite-040g-md-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
