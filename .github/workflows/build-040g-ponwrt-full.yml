#
# 基于 P3TERX/Actions-OpenWrt 模板改造
# 目标源码: pbs05/ponwrt (master)
# 机型:     Nokia XG-040G-MD (UBI) / airoha an7581
# 配置:     ponwrt 官方 configs/an7581.config + configs/release.config 作基线，
#           仓库根 .config 作叠加层（只写要额外选的包与开关）
# DIY:      diy-part1(改 feeds) / diy-part2(内核+插件) / diy-part3(argon, feeds install 之后)
# 落地文件: files/  (实机 etc/config、root 密码、fwxd 特性、OAF 应用图标、首启 uci-defaults)
#
# 关键特性:
#   - 桥接(L2)/L3 硬件加速: fw4 flowtable + PPE, 默认 flow_offloading=1
#   - 每流字节统计: CONFIG_NET_AIROHA_FLOW_STATS=y (airoha_ppe_foe_flow_stats_* / FLOW_CLS_STATS)
#   - PON 光模块驱动: kmod-airoha-xpon + kmod-airoha-pon-frontend + kmod-airoha-en7572，全部强制 =y
#   - 2.5G 网口: kmod-phy-airoha-en8811h + airoha-en8811h-firmware，强制 =y（lan1 2500base-x）
#   - 插件: luci-app-onu(naoki66 ONU_CONFIG) + luci-app-airoha-npu(luanmuc) + argon v3.1.1
#   - OAF 应用识别: 先删掉源码/feeds 里自带的 OpenAppFilter，再重新 clone
#                  destan19/OpenAppFilter 最新版（kmod-oaf + appfilter + luci-app-oaf）
#   - UPnP: miniupnpd-nftables + luci-app-upnp
#   - mosdns v5: sbwml/luci-app-mosdns v5 整仓（本体 5.3.x + LuCI + geo2txt）+ sbwml v2ray-geodata，
#                Go 工具链同步换成 sbwml/packages_lang_golang 27.x（Go 1.27.3）
#   - 去除 dummy 接口 (kmod-dummy 不选 + 构建期/首启清理 dummy0)
#   - 工具链缓存复用: actions/cache + Release(toolchain-cache) 双级缓存
#

name: 040G-MD 标准版 (PonWrt)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接调试'
        required: false
        default: 'false'
  schedule:
    # 每天早上 06:00（Asia/Shanghai）自动编一次。
    # GitHub 的 cron 一律按 UTC 算，06:00 CST = 前一天 22:00 UTC，所以写 0 22 * * *
    # 注意：GitHub 的定时任务在整点高峰常被推迟几分钟到半小时，属于平台行为。
    - cron: '0 22 * * *'

permissions:
  contents: write
  actions: write

# 与纯净版 (build-040g-ponwrt-lite.yml) 共用 toolchain-cache 这个 Release，
# 同组串行，避免两个工作流同时写缓存互相覆盖
concurrency:
  group: ponwrt-toolchain-cache
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/pbs05/ponwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config-ponwrt-full
  DIY_P1_SH: diy-ponwrt-full-1.sh
  DIY_P2_SH: diy-ponwrt-full-2.sh
  DIY_P3_SH: diy-ponwrt-full-3.sh
  UPLOAD_RELEASE: true
  DEVICE_NAME: 040g-md
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment (disk cleanup)
      run: |
        # runner 只有 73G 磁盘, 编译期必然吃满; 先把镜像里用不到的大件清干净
        # (android sdk / dotnet / ghc / hostedtoolcache / boost / swift / ghcup / docker 镜像)
        # 正常 20~60 秒; docker prune 卡住就放弃, 它只是省磁盘, 不影响编译
        t0=$(date +%s)
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
                    /opt/microsoft /usr/local/lib/node_modules /opt/az /usr/local/aws-cli || true
        timeout 300 sudo docker image prune --all --force || echo "::warning::docker image prune 超时/失败, 跳过"
        timeout 300 sudo docker system prune -af --volumes || echo "::warning::docker system prune 超时/失败, 跳过"
        sudo rm -rf /var/lib/apt/lists/*
        # ---- 补 6G swap: 编译收尾 (rootfs / squashfs 打包) 是内存峰值 ----
        # run 42329431482 / 42345335830 都在编译 ~120 分钟时整台 runner 失联,
        # 注解是 "starves it for CPU/Memory"。hosted runner 默认几乎没有 swap,
        # OOM killer 一旦连 Runner.Listener 一起杀掉, job 直接 lost communication,
        # 合并日志 blob 和 ccache 的 post-save 也全都不会发生 —— 于是下一次
        # 又得全量重编 120 分钟, 形成死循环。
        # 用独立文件名, 绝不碰 runner 镜像可能自带的 /swapfile:
        # 对正在使用的 swapfile 执行 mkswap 会重写其头部, 有破坏风险。
        SWP=/swapfile-wb
        sudo fallocate -l 6G "$SWP" 2>/dev/null || true
        if [ -f "$SWP" ]; then
          sudo chmod 600 "$SWP"
          sudo mkswap "$SWP" >/dev/null 2>&1 || true
          sudo swapon "$SWP" 2>/dev/null || echo "::warning::swapon 失败, 继续编译 (不影响结果)"
        else
          echo "::warning::swapfile 创建失败, 继续编译"
        fi
        sudo sysctl -w vm.swappiness=10 >/dev/null 2>&1 || true
        echo "清理耗时 $(( $(date +%s) - t0 ))s"; df -hT /; free -h

    - name: Initialization environment (apt)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # ---- 为什么把 apt 拆成独立一步: ----
        # run 42246988282 总耗时 3h35m, 其中编译只占 55 分钟, 剩下 2h36m 全挂在
        # 这个初始化步骤里 —— 而这一步根本看不出停在哪: 原来是一条
        #   apt-get -qq install <90 个包>
        # -qq 把下载进度全部吞掉, 卡住时日志一行都不涨, 只能干等到 job 超时。
        # 另外 runner 镜像本来就预装了其中大部分, 原写法等于每次重下几百 MB。
        # 现在: 先 dpkg 探测跳过已装的, 加 --no-install-recommends, 每条网络命令都套 timeout。
        t0=$(date +%s)
        PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd"
        MISSING=""
        for p in $PKGS; do
          dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" || MISSING="$MISSING $p"
        done
        CNT_ALL=$(echo $PKGS | wc -w); CNT_MISS=$(echo $MISSING | wc -w)
        echo "apt: 共 $CNT_ALL 个, 镜像已装 $((CNT_ALL-CNT_MISS)) 个, 待装 $CNT_MISS 个:$MISSING"
        if [ "$CNT_MISS" -gt 0 ]; then
          # update 正常 30~60 秒, 给 10 分钟上限
          timeout 600 sudo -E apt-get -qq update \
            || echo "::warning::apt-get update 超时或失败, 继续尝试 install"
          # 先确认有安装候选: 名字不存在会让整批 install 直接非 0 退出, 连带其它包一个都装不上
          OK=""
          for p in $MISSING; do
            if apt-cache show "$p" >/dev/null 2>&1; then OK="$OK $p"; else echo "::warning::$p 无安装候选, 跳过"; fi
          done
          if [ -n "$OK" ]; then
            # 几百 MB 正常 2~4 分钟, 给 20 分钟上限
            timeout 1200 sudo -E apt-get -qq install -y --no-install-recommends \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
                -o Dpkg::Options::=--force-confnew $OK \
              || echo "::warning::批量安装未正常结束, 下面逐个补装"
            # 逐个补: 批量中断时 apt 可能一个都没落地
            for p in $OK; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" && continue
              timeout 300 sudo -E apt-get -qq install -y --no-install-recommends "$p" \
                || echo "::warning::$p 安装失败, 编译期若报缺再补"
            done
          fi
        fi
        sudo -E apt-get -qq clean || true
        echo "apt 耗时 $(( $(date +%s) - t0 ))s"

    - name: Initialization environment (timezone / workdir)
      run: |
        sudo timedatectl set-timezone "$TZ" || echo "::warning::设置时区失败"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -hT / | tail -1

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds / DIY part 1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # 自定义插件必须在 update 之后 / install 之前执行
    - name: Custom packages / DIY part 2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install feeds
      run: |
        cd openwrt
        # 个别 feed 包可能与本地 package/ 里的同名包冲突（argon / oaf / mosdns 已由 diy 脚本接管），
        # install 返回非 0 时继续，真正的缺失由下一步的包校验兜底。
        ./scripts/feeds install -a || echo "⚠️  feeds install 返回非 0，继续（后续有包存在性校验）"

    # argon v3.1.1 必须在 feeds install 之后覆盖，否则会被 feeds 里的旧版顶掉
    - name: Argon theme v3.1.1 / DIY part 3
      run: |
        chmod +x $DIY_P3_SH
        $GITHUB_WORKSPACE/$DIY_P3_SH

    - name: Load custom configuration
      run: |
        mkdir -p openwrt/files
        if [ -d files ]; then cp -a files/. openwrt/files/ && echo "files/ 已合并进 openwrt/files ($(find openwrt/files -type f | wc -l) 个文件)"; fi
        cd openwrt
        # 1) 官方基线: ponwrt 自带 configs/an7581.config + configs/release.config
        #    （含 UBIFS / initramfs / squashfs / 内核参数等镜像级设置，手写种子缺失会编出不能启动的镜像）
        ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
        # 2) 只编本机: 去掉其它机型的 DEVICE 选择，保留官方 MULTI_PROFILE 模式
        sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
        echo 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' >> .config
        # 3) 叠加仓库里的 .config（本仓库的包选择 / 开关）
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        make defconfig
        echo "===== 目标相关行 ====="
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|MULTI_PROFILE)=' .config
        grep -E 'nokia_xg-040g-md-ubi=y$' .config || true
        # ---- ccache: 编译器对象缓存, 跨构建复用已编译的 .o ----
        # Config.in / Config-build.in 里没有 "config CCACHE" 这个符号, 探测式永远不成立
        # (实测连续几轮都是 warning)。rules.mk 判的是 make 变量 CONFIG_CCACHE,
        # 直接写进 .config 即可, 但不要紧跟 make defconfig —— kconfig 认不得这个符号, 会把它清掉。
        # 可用性由后面的 Handle toolchain 校验: ccache 起不来就删掉这行并回退。
        if ! grep -q '^CONFIG_CCACHE=y' .config; then
          echo 'CONFIG_CCACHE=y' >> .config
        fi
        if grep -q '^CONFIG_CCACHE=y' .config; then
          echo "✅ CONFIG_CCACHE 已启用（host ccache 在工具链阶段校验）"
        else
          echo "::warning::CONFIG_CCACHE 未生效，本次不使用 ccache（不影响构建）"
        fi

    - name: Verify target device
      run: |
        cd openwrt
        BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUB=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
        # 单 profile 符号: CONFIG_TARGET_<board>_<sub>_DEVICE_<dev>=y
        # 多 profile 符号: CONFIG_TARGET_DEVICE_<board>_<sub>_DEVICE_<dev>=y
        DEV=$(grep -oE '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia[^=]*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/')
        [ -n "$DEV" ] || DEV=$(grep -oE '^CONFIG_TARGET_airoha_an7581_DEVICE_nokia[^=]*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/')
        echo "board=$BOARD subtarget=$SUB device=$DEV"
        if [ "$BOARD" != "airoha" ] || [ "$SUB" != "an7581" ]; then
          echo "❌ 目标不符: 期望 airoha/an7581, 实际 $BOARD/$SUB"; exit 1
        fi
        if [ "$DEV" != "nokia_xg-040g-md-ubi" ]; then
          echo "❌ 设备不符: 期望 nokia_xg-040g-md-ubi, 实际 '$DEV'"
          echo "--- 可用的 nokia 设备符号 ---"
          grep -E 'nokia' .config || true
          exit 1
        fi
        echo "✅ 目标校验通过: airoha/an7581/$DEV"

    - name: Verify PON / 2.5G / accel / plugins
      run: |
        cd openwrt
        ok=1
        need() {
          if grep -qE "^$1=[ym]$" .config; then echo "✅ $1";
          else echo "❌ 缺少 $1"; ok=0; fi
        }
        # 必须编进内核镜像(=y)，不能是 =m 外挂模块
        needy() {
          if grep -qE "^$1=y$" .config; then echo "✅ $1=y";
          else
            echo "❌ $1 不是 =y（当前: $(grep -E "^$1=" .config || echo '未出现')）"; ok=0
          fi
        }
        echo "----- PON 驱动栈 / 光模块驱动（强制 =y）-----"
        needy CONFIG_PACKAGE_kmod-airoha-xpon
        needy CONFIG_PACKAGE_kmod-airoha-pon-frontend
        needy CONFIG_PACKAGE_kmod-airoha-en7572
        needy CONFIG_PACKAGE_airoha-pond
        needy CONFIG_PACKAGE_airoha-ponctl
        echo "----- 2.5G 网口 PHY EN8811H（强制 =y）-----"
        needy CONFIG_PACKAGE_kmod-phy-airoha-en8811h
        needy CONFIG_PACKAGE_airoha-en8811h-firmware
        echo "----- 硬件加速 (L2 桥接 / L3) -----"
        need CONFIG_PACKAGE_kmod-nf-conntrack-bridge
        if grep -qE '^CONFIG_PACKAGE_kmod-nft-offload=[ym]$' .config; then
          echo "✅ CONFIG_PACKAGE_kmod-nft-offload"
        else
          echo "⚠️  kmod-nft-offload 未显式选中(由 firewall4 依赖带入, 下一步会复查)"
        fi
        echo "----- 内核开关: 每流统计 -----"
        if grep -qE '^CONFIG_NET_AIROHA_FLOW_STATS=y' target/linux/airoha/an7581/config-6.18; then
          echo "✅ CONFIG_NET_AIROHA_FLOW_STATS=y (config-6.18 已改写)"
        else
          echo "❌ CONFIG_NET_AIROHA_FLOW_STATS 未在 config-6.18 中打开"; ok=0
        fi
        echo "----- 插件 -----"
        need CONFIG_PACKAGE_luci-theme-argon
        need CONFIG_PACKAGE_luci-app-airoha-npu
        need CONFIG_PACKAGE_luci-app-onu
        need CONFIG_PACKAGE_luci-app-pon-status
        echo "----- OAF 应用识别 (对应 files/ 里的 oaf 图标与 fwxd/feature.bin) -----"
        need CONFIG_PACKAGE_kmod-oaf
        need CONFIG_PACKAGE_appfilter
        need CONFIG_PACKAGE_luci-app-oaf
        echo "----- UPnP -----"
        need CONFIG_PACKAGE_luci-app-upnp
        need CONFIG_PACKAGE_miniupnpd-nftables
        echo "----- mosdns v5 / Go 工具链 -----"
        need CONFIG_PACKAGE_mosdns
        need CONFIG_PACKAGE_luci-app-mosdns
        need CONFIG_PACKAGE_geo2txt
        need CONFIG_PACKAGE_v2ray-geoip
        need CONFIG_PACKAGE_v2ray-geosite
        # golang 包的 Makefile 有两种布局, 都要认:
        #   上游 packages: lang/golang/Makefile
        #   sbwml 27.x:    lang/golang/golang/Makefile  (仓库根放 *.mk, 包在 golang/ 子目录)
        GO_MK=""
        for c in feeds/packages/lang/golang/golang/Makefile feeds/packages/lang/golang/Makefile; do
          if [ -f "$c" ]; then GO_MK="$c"; break; fi
        done
        if [ -n "$GO_MK" ]; then
          echo "✅ Go: $(grep -m1 '^PKG_VERSION' "$GO_MK")  [$GO_MK]"
          if grep -qE '^(mosdns|PKG_VERSION):=5\.' package/mosdns/mosdns/Makefile 2>/dev/null; then
            echo "✅ mosdns: $(grep -m1 '^PKG_VERSION' package/mosdns/mosdns/Makefile)"
          else
            echo "❌ package/mosdns/mosdns 不是 v5 分支产物"; ok=0
          fi
        else
          echo "❌ golang 包 Makefile 缺失 (已查 lang/golang/golang 与 lang/golang 两种布局)"; ok=0
        fi
        echo "----- OAF 版本（应是重新拉取的上游最新）-----"
        echo "    appfilter: $(grep -m1 '^PKG_VERSION' package/open-app-filter/Makefile 2>/dev/null || echo '缺失')"
        echo "    luci-app-oaf: $(grep -m1 '^PKG_VERSION' package/luci-app-oaf/Makefile 2>/dev/null || echo '缺失')"
        echo "----- files/ 叠加层 -----"
        for f in etc/config/network etc/config/pon etc/config/firewall etc/config/upnpd etc/shadow \
                 etc/config/mosdns etc/config/onu-internet etc/internet.nft etc/iptv.nft etc/apk/config \
                 etc/uci-defaults/99-ponwrt-time \
                 usr/lib/lua/luci/oaf_traffic.lua \
                 usr/lib/lua/luci/controller/oaf_user.lua \
                 usr/lib/lua/luci/controller/oaf_dashboard.lua \
                 usr/lib/lua/luci/view/oaf/dashboard.htm \
                 usr/lib/lua/luci/view/oaf/user_status.htm \
                 usr/lib/lua/luci/view/oaf/user_detail.htm \
                 usr/sbin/oaf-flowd etc/init.d/oaf-flowd; do
          if [ -f "files/$f" ]; then echo "✅ files/$f"; else echo "❌ 缺少 files/$f"; ok=0; fi
        done
        # 采集器 / 服务脚本必须带可执行位（git 在 Windows 上 checkout 会丢，靠 index 的 755 保住）
        if [ -x "files/usr/sbin/oaf-flowd" ]; then
          echo "✅ files/usr/sbin/oaf-flowd 可执行 ($(stat -c%s files/usr/sbin/oaf-flowd) 字节)"
        else
          echo "❌ files/usr/sbin/oaf-flowd 没有可执行位"; ok=0
        fi
        # OUI 品牌库（设备图标 + vendor 名字）
        if [ -f "files/www/luci-static/resources/oui/vendors-d337209f8c00.json" ]; then
          echo "✅ OUI 品牌库 $(ls files/www/luci-static/resources/oui/*.svg 2>/dev/null | wc -l) 个厂牌图标"
        else
          echo "❌ files/ 缺少 OUI 品牌库（设备图标会全部退化成首字母）"; ok=0
        fi
        # mosdns 的 adblock 默认必须是关的：ad_source 为空时 adblock=1 会让 mosdns 起不来，
        # 连带 dnsmasq 没有上游 → 全网 DNS 死 → NTP 用域名也校不回时间
        if grep -q "option adblock '0'" files/etc/config/mosdns 2>/dev/null; then
          echo "✅ mosdns adblock 默认关闭"
        else
          echo "❌ files/etc/config/mosdns 里 adblock 没关（无 ad_source 时会崩）"; ok=0
        fi
        if grep -q "203.107.6.88" files/etc/uci-defaults/99-ponwrt-time 2>/dev/null; then
          echo "✅ 首启时区/NTP/adlist 兜底脚本就位"
        else
          echo "❌ files/etc/uci-defaults/99-ponwrt-time 缺失或没写 NTP IP"; ok=0
        fi
        # apk 必须关掉签名校验
        if grep -qx 'allow-untrusted' files/etc/apk/config 2>/dev/null; then
          echo "✅ apk 已关闭签名校验 (allow-untrusted)"
        else
          echo "❌ files/etc/apk/config 里没有 allow-untrusted"; ok=0
        fi
        if ls files/www/luci-static/resources/oaf/app_icons/*.png >/dev/null 2>&1; then
          echo "✅ OAF 应用图标 $(ls files/www/luci-static/resources/oaf/app_icons/*.png | wc -l) 个"
        else
          echo "⚠️  files/ 中没有 OAF 应用图标"
        fi
        echo "----- dummy 接口已排除 -----"
        if grep -qE '^CONFIG_PACKAGE_kmod-dummy=[ym]' .config; then
          echo "❌ kmod-dummy 仍被选中"; ok=0
        else
          echo "✅ kmod-dummy 未选中"
        fi
        if [ "$ok" != "1" ]; then echo "❌ 校验失败, 终止编译"; exit 1; fi
        echo "✅ 全部校验通过"

    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
        echo "CACHE_KEY=toolchain-airoha-an7581-${TOOLS_HASH:0:16}" >> $GITHUB_OUTPUT
        echo "CACHE_PREFIX=toolchain-airoha-an7581" >> $GITHUB_OUTPUT
        echo "缓存键: toolchain-airoha-an7581-${TOOLS_HASH:0:16}"
        # ---- 二次利用: dl 源码包 + ccache 的缓存键 ----
        # dl 按月轮转 / ccache 按 ISO 周轮转: 同周期内精确命中即不重复保存,
        # 避免每次构建都写一条新缓存把 10GB 配额挤爆、反过来淘汰工具链缓存。
        echo "CACHE_TAG=airoha-an7581" >> $GITHUB_OUTPUT
        echo "DL_KEY=dl-airoha-an7581-$(date -u +%Y%m)" >> $GITHUB_OUTPUT
        echo "CC_KEY=ccache-airoha-an7581-$(date -u +%G-W%V)" >> $GITHUB_OUTPUT
        echo "dl 键: dl-airoha-an7581-$(date -u +%Y%m)  ccache 键: ccache-airoha-an7581-$(date -u +%G-W%V)"

    - name: Restore toolchain (actions/cache)
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Restore toolchain (Release backup)
      if: steps.cache-restore.outputs.cache-hit != 'true'
      id: release-restore
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        ASSET="${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "toolchain-cache 不存在, 首次运行"
          exit 0
        fi
        if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
          gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D .
          if [ -e "$ASSET" ]; then
            tar -I unzstd -xf "$ASSET" || tar -xf "$ASSET"
            rm -f "$ASSET"
            echo "restored=true" >> $GITHUB_OUTPUT
            echo "Release 工具链恢复成功"
          else
            echo "restored=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "Release 中无该缓存: $ASSET"
        fi

    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt
        if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
          echo "actions/cache 命中, 跳过工具链编译"
          echo "save_cache=false" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        elif [ "${{ steps.release-restore.outputs.restored }}" = "true" ]; then
          echo "Release 缓存命中, 回写 actions/cache"
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        else
          echo "无缓存, 开始编译工具链..."
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=true" >> $GITHUB_OUTPUT
        fi
        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile
        echo "Makefile 已修改: 后续跳过工具链重编译"
        # ---- ccache: PATH 与 staging 两个通道都要通, 否则回退关闭 ----
        # 1) rules.mk:  TARGET_CC := ccache $(TARGET_CC)                         → 走 PATH
        # 2) cmake.mk:  -DCMAKE_C_COMPILER_LAUNCHER=$(STAGING_DIR_HOST)/bin/ccache → 绝对路径
        # 上一版只校验 PATH, 结果 cmake 包 (libnl-tiny / fwtool 等) 编译期报
        #   /bin/sh: .../staging_dir/host/bin/ccache: not found  → Error 127
        if grep -q '^CONFIG_CCACHE=y' .config 2>/dev/null; then
          SYSCC=$(command -v ccache 2>/dev/null || true)
          mkdir -p staging_dir/host/bin
          if [ ! -x staging_dir/host/bin/ccache ]; then
            if [ -n "$SYSCC" ]; then
              echo "补 staging ccache: $SYSCC -> staging_dir/host/bin/ccache (cmake.mk 需要该绝对路径)"
              ln -sf "$SYSCC" staging_dir/host/bin/ccache 2>/dev/null \
                || cp -f "$SYSCC" staging_dir/host/bin/ccache 2>/dev/null || true
            else
              echo "PATH 上没有 ccache, 尝试 make tools/ccache/install ..."
              make tools/ccache/install -j$(nproc) >/dev/null 2>&1 || true
            fi
          fi
          if [ -x staging_dir/host/bin/ccache ]; then
            # rules.mk 里 CCACHE_DIR 默认 $(TOPDIR)/.ccache, 与 actions/cache 的路径一致
            export CCACHE_DIR="$PWD/.ccache"
            mkdir -p "$CCACHE_DIR"
            # 1G 对全量 OpenWrt 远远不够: .o 不断被淘汰, 命中率低, 每次都要
            # 重编 120 分钟以上, 正好撞上 runner 的资源临界点。放宽到 4G。
            staging_dir/host/bin/ccache --max-size=4G >/dev/null 2>&1 || true
            echo "✅ ccache 可用 (PATH + staging 双通道均已满足):"
            staging_dir/host/bin/ccache --version | head -1 || true
            staging_dir/host/bin/ccache -s | head -8 || true
          else
            echo "::warning::ccache 不可用 (staging_dir/host/bin/ccache 缺失且无法补齐), 回退关闭 CONFIG_CCACHE"
            sed -i '/^CONFIG_CCACHE/d' .config
            echo '# CONFIG_CCACHE is not set' >> .config
            make defconfig
          fi
        fi

    - name: Save toolchain (actions/cache)
      uses: actions/cache/save@v4
      if: steps.toolchain.outputs.save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Save toolchain (Release backup)
      if: steps.toolchain.outputs.save_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"
        tar -I zstdmt -cf "${KEY}.tzst" staging_dir/host* staging_dir/tool*
        ls -lh "${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" --title "Toolchain Cache" --notes "自动生成的工具链缓存, 请勿删除" --latest=false
        fi
        gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep "^${PREFIX}" | while read -r old; do
          echo "删除旧缓存: $old"
          gh release delete-asset toolchain-cache "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
        done
        gh release upload toolchain-cache "${KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
        rm -f "${KEY}.tzst"

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true'

    - name: Restore dl cache (源码包)
      uses: actions/cache@v4
      id: dl-cache
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.cache-key.outputs.DL_KEY }}
        restore-keys: |
          dl-airoha-an7581-

    - name: Restore ccache (编译对象缓存)
      uses: actions/cache@v4
      id: ccache-cache
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ steps.cache-key.outputs.CC_KEY }}
        restore-keys: |
          ccache-airoha-an7581-

    - name: Report cache state
      run: |
        cd openwrt
        echo "dl 命中: ${{ steps.dl-cache.outputs.cache-hit }} / ccache 命中: ${{ steps.ccache-cache.outputs.cache-hit }}"
        du -sh dl 2>/dev/null || echo "dl 尚不存在"
        # Go 模块缓存 (dl/go-mod-cache) 不要跨构建复用。
        # 实证: run 41485399379 / 41397272479 没有 dl 缓存时 mosdns 5.3.4 编译通过;
        # run 41485388868 恢复了含 go-mod-cache 的 dl 缓存, package/mosdns/mosdns
        # 进 compile 5 秒就 failed to build (GOMODCACHE 里是别的构建留下的模块集)。
        # 删掉最稳: Go 包会在线重取, 多花 1~2 分钟, 换掉一类难查的秒失败。
        if [ -d dl/go-mod-cache ]; then
          echo "丢弃 dl/go-mod-cache ($(du -sh dl/go-mod-cache | cut -f1)), Go 包改为在线取模块"
          rm -rf dl/go-mod-cache
        fi
        du -sh .ccache 2>/dev/null || echo ".ccache 尚不存在"
        df -hT / | tail -1

    - name: Download package
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        df -hT /
        # 原写法 make -j || make -j1 || make -j1 V=s: 磁盘写满时也会重试两次, 白耗十几分钟
        echo "起始资源:"; free -m | head -2; df -hT / | tail -1
        # run 42329431482: 编译到 ~120 分钟时 hosted runner 直接失联, 该步骤永远
        # 停在 in_progress, 连日志 blob 都没上传 (API 下载报 BlobNotFound), 产物 0 个。
        # 原写法 make ... 2>&1 | tee 把几十万行编译输出实时灌进 Actions 日志流,
        # runner 要一直扛日志上传。现在只写文件, 前台改用 60s 心跳保持输出,
        # 同时留下内存/磁盘曲线 —— 再掉线就能区分是 OOM 还是磁盘写满。
        set +e
        make -j$(nproc) > /tmp/build.log 2>&1 &
        mkpid=$!
        : > /tmp/heartbeat.log
        # cgroup v2 的 oom_kill 计数是判断「runner 是不是被 OOM 干掉」最直接的证据
        OOM0=0
        if [ -r /sys/fs/cgroup/memory.events ]; then
          OOM0=$(awk '/^oom_kill /{print $2}' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
          case "$OOM0" in ''|*[!0-9]*) OOM0=0;; esac
        fi
        while kill -0 "$mkpid" 2>/dev/null; do
          # 30 秒一次: 收尾打包阶段内存/磁盘掉得很快, 60 秒可能来不及留证据
          sleep 30 || true
          mem=$(free -m | awk 'NR==2{print $3"/"$2" MB used"}')
          disk=$(df -h / | awk 'NR==2{print $3"/"$2" used"}')
          cg=""
          oom=$OOM0
          if [ -r /sys/fs/cgroup/memory.events ]; then
            oom=$(awk '/^oom_kill /{print $2}' /sys/fs/cgroup/memory.events 2>/dev/null || echo "$OOM0")
            case "$oom" in ''|*[!0-9]*) oom=$OOM0;; esac
            cur=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo "?")
            mx=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo "?")
            cg=" | cgroup $cur/$mx oom_kill=$oom"
          fi
          last=$(tail -1 /tmp/build.log | cut -c1-90)
          line="[$(date +%H:%M:%S)] building | log $(wc -l < /tmp/build.log) 行 | mem $mem | disk $disk$cg | $last"
          echo "$line" | tee -a /tmp/heartbeat.log
          if [ "$oom" -gt "$OOM0" ]; then
            echo "::warning::cgroup OOM kill 增加 ($OOM0 -> $oom): 内存已不足, 本次编译结果不可信"
            OOM0=$oom
          fi
          avail=$(df -m / | awk 'NR==2{print $4}')
          if [ -n "$avail" ] && [ "$avail" -lt 4096 ]; then
            echo "::error::磁盘剩余 ${avail}MB, 主动终止编译, 避免 runner 被写爆后连日志都传不回来"
            kill "$mkpid" 2>/dev/null || true
            break
          fi
        done
        wait "$mkpid"
        rc=$?
        set -e
        echo "make 退出码 $rc, 编译日志 $(wc -l < /tmp/build.log) 行"
        tail -25 /tmp/build.log || true
        if [ "$rc" -ne 0 ]; then
          if grep -qE 'No space left on device|running out of disk space' /tmp/build.log; then
            echo "::error::磁盘写满 (ENOSPC), 编译中断; 重试只会继续失败"
            df -hT /
            exit 1
          fi
          # -j 的 trace 输出会把真正的错误行淹掉, 必须 -j1 V=s 重跑才拿得到原因。
          # 重跑只补做失败的那几个包 (stamp 都在), 一般几分钟, 不会重来两小时。
          echo "::warning::首次编译失败 (非磁盘原因), 用 -j1 V=s 抓详细错误"
          set +e
          make -j1 V=s > /tmp/build2.log 2>&1
          rc=$?
          set -e
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::编译失败"
          echo "===== 资源 ====="
          free -m | head -2 || true
          df -hT / || true
          echo "===== 关键错误行 ====="
          grep -nE '(^|[[:space:]])(ERROR:|Error [0-9]+|error:|\*\*\* |No such file|Cannot |undefined reference|command not found)' /tmp/build2.log 2>/dev/null | tail -50 || true
          echo "===== 失败包上下文 ====="
          grep -nE 'make\[[0-9]+\].*(Error|\*\*\*)' /tmp/build2.log 2>/dev/null | tail -20 || true
          echo "===== 磁盘 ====="
          df -hT / || true
          echo "===== 末尾 150 行 ====="
          tail -150 /tmp/build2.log 2>/dev/null || tail -150 /tmp/build.log
          exit 1
        fi
        if [ -x staging_dir/host/bin/ccache ]; then
          echo "===== ccache 命中率 ====="
          staging_dir/host/bin/ccache -s 2>/dev/null | head -12 || true
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-ponwrt-full
        path: |
          /tmp/build.log
          /tmp/build2.log
          /tmp/heartbeat.log
        if-no-files-found: ignore
        retention-days: 3

    - name: Verify built kernel config
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        KCFG=$(ls -d build_dir/target-*/linux-airoha_an7581/linux-*/.config 2>/dev/null | head -1)
        echo "kernel config: $KCFG"
        if [ -n "$KCFG" ]; then
          for sym in CONFIG_NET_AIROHA_FLOW_STATS CONFIG_NET_AIROHA CONFIG_NF_FLOW_TABLE CONFIG_NFT_FLOW_OFFLOAD; do
            echo "$(grep -E "^${sym}=" "$KCFG" || echo "$sym <未设置>")"
          done
          grep -qE '^CONFIG_NET_AIROHA_FLOW_STATS=y' "$KCFG" \
            && echo "✅ 内核已编入每流统计" \
            || echo "⚠️  CONFIG_NET_AIROHA_FLOW_STATS 未生效(检查 Kconfig 依赖)"
        fi
        echo "===== PPE TCP_FIN 老化时间 (补丁应已生效: 30s) ====="
        PSRC=$(ls -d build_dir/target-*/linux-airoha_an7581/linux-*/drivers/net/ethernet/airoha/airoha_ppe.c 2>/dev/null | head -1)
        if [ -n "$PSRC" ]; then
          grep -nE 'FIELD_PREP\(PPE_BIND_AGE1_DELTA_TCP_FIN,' "$PSRC" | sed 's/^/  /'
          if grep -qE 'PPE_BIND_AGE1_DELTA_TCP_FIN, 30\)' "$PSRC"; then
            echo "✅ TCP_FIN 老化已改为 30s (条目在 FIN 后多留 30s, 流量统计能取到终值)"
          else
            echo "❌ TCP_FIN 老化补丁未生效: 内核里还是 1s, 秒级大流量的统计会明显偏低"
            exit 1
          fi
        else
          echo "⚠️  找不到已解包的 airoha_ppe.c, 跳过检查"
        fi
        echo "===== 生成的包 (PON / PHY) ====="
        ls bin/targets/airoha/an7581/packages/ 2>/dev/null | grep -iE 'airoha-(xpon|en7572|pon)|en8811h' || true

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=${DEVICE_NAME}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT
        {
          echo "## PonWrt 固件 (Nokia XG-040G-MD)"
          echo ""
          echo "| 项目 | 详情 |"
          echo "|------|------|"
          echo "| 源码 | $REPO_URL ($REPO_BRANCH) |"
          echo "| 设备 | airoha/an7581 / nokia_xg-040g-md-ubi |"
          echo "| 硬件加速 | fw4 flowtable(L2+L3) + PPE, 默认 flow_offloading=1 |"
          echo "| 每流统计 | CONFIG_NET_AIROHA_FLOW_STATS=y |"
          echo "| PON | airoha-xpon + pon-frontend + en7572 |"
          echo "| 2.5G | phy-airoha-en8811h (lan1) |"
          echo "| 插件 | luci-app-onu / luci-app-airoha-npu / argon v3.1.1 |"
          echo "| 时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |"
        } > release.txt

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.itb
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
        delete_tag_pattern: '^040g-md-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
