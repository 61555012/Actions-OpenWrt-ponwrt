#
# 040G-MD 纯净版（LEDE 源码）构建流水线
# 与 build-040g-ponwrt-full.yml（标准版）、build-040g-ponwrt-lite.yml（PonWrt 纯净版）并列，互不影响
#
# 目标源码: coolsnowwolf/lede (master)
# 机型:     Nokia XG-040G-MD (UBI) / airoha an7581  (LEDE 自带 nokia_xg-040g-md-ubi)
# 配置:     LEDE 没有官方 an7581 基线 config，用仓库根 .config-lede-lite 作【最小种子】，
#           其余交给 make defconfig 按 LEDE 默认值补齐
# DIY:      diy-lede-lite-1.sh(追加 PON feeds) / diy-lede-lite-2.sh(内核统计 + 去 dummy + 首启默认值 + root 密码)
# 落地文件: 无 —— 纯净版【不引用仓库 files/】，出厂默认值全部由 diy-lede-lite-2.sh 在构建期写进源码树
#           默认 root 密码: admin123
#
# 纯净版 = 只保留"光口能起来 + 拨号 + 硬件加速转发"所需的最小集合:
#   ✓ PON 驱动栈 + 光模块驱动 EN7572（pbs05 feeds）  ✓ 2.5G PHY EN8811H
#   ✓ fw4 flowtable(L2 桥接 + L3) + PPE 硬件加速      ✓ CONFIG_NET_AIROHA_FLOW_STATS=y
#   ✓ luci + bootstrap + luci-app-pon (LEDE 原生) / luci-app-pon-status
#   ✓ 拨号: ppp / ppp-mod-pppoe / luci-proto-ppp      ✓ dnsmasq-full / odhcp6c / odhcpd
#   ✓ 无 dummy 接口   ✓ 默认 root 密码 admin123
#   ✗ ssr-plus / passwall / openclash / bypass / vssr 等代理插件（helloworld feed 已关闭）
#   ✗ turboacc / upnp / ddns / wol / vsftpd / vlmcsd / nlbwmon / autoreboot 等 lean 插件
#   ✗ argon 主题  ✗ OAF  ✗ mosdns  ✗ NPU 面板  ✗ 仓库 files/ 覆盖层
#
# 第三方插件的来源是 LEDE 的 include/target.mk → DEFAULT_PACKAGES.router（默认带 lean 插件），
# 由 diy-lede-lite-2.sh 在 defconfig 前替换成白名单，Verify 步骤会硬校验。
#
# 产物区分: Release tag 前缀 lede-lite-040g-md-
# 工具链缓存独立: toolchain-lede-an7581-*（LEDE 的 tools/toolchain 与 PonWrt 不同，不能混用）
#

name: 040G-MD 纯净版 (LEDE)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接调试'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

# LEDE 工具链缓存自己一组，PonWrt 那组是 ponwrt-toolchain-cache
concurrency:
  group: lede-toolchain-cache
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config-lede-lite
  DIY_P1_SH: diy-lede-lite-1.sh
  DIY_P2_SH: diy-lede-lite-2.sh
  ROOT_PASS: admin123
  UPLOAD_RELEASE: true
  DEVICE_NAME: lede-lite-040g-md
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # runner 只有 73G 磁盘, 编译期必然吃满; 先把镜像里用不到的大件清干净
        # (android sdk / dotnet / ghc / hostedtoolcache / boost / swift / ghcup / docker 镜像)
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
                    /opt/microsoft /usr/local/lib/node_modules /opt/az /usr/local/aws-cli || true
        sudo docker image prune --all --force
        sudo docker system prune -af --volumes || true
        sudo rm -rf /var/lib/apt/lists/*
        echo "----- 清理后磁盘 -----"; df -hT /
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Add PON feeds / DIY part 1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Kernel tweaks / DIY part 2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Dedupe duplicate PON packages
      run: |
        cd openwrt
        # LEDE 自带的 packages feed 里已经有 pon 全套 (airoha-pon-daemons/airoha-ponctl/
        # airoha-xpon/airoha-pon-frontends/luci-app-pon/luci-app-iptv), 而 diy part1 又追加了
        # pon_drivers (pbs05) 与 pon_userspace (naoki66), 三份 feed 存在同名包。
        #
        # 后果: package/feeds 下同名目录并存 -> genpackageindex 只保留最后收集的一份,
        # 而 make 编译的可能是另一份, ipk 与依赖清单对不上; 直接表现是
        #   * opkg_install_cmd: Cannot install package luci-app-onu
        # 因为它依赖的 airoha-pond / airoha-ponctl / kmod-airoha-xpon 根本没进安装列表
        # (run 41397279819 就是这个现象: 编译全过, package/install 6 秒失败)。
        #
        # 统一以 LEDE 自带 packages/pon 为准, pon_userspace 只保留 luci-app-pon-status
        # (包含 luci-app-onu 的那两个包会与原生 luci-app-pon 写同一批文件, 已弃用 onu)。
        # 注意: scripts/feeds install 会把 feed 内的目录层级「展平」,
        # feeds/packages/pon/airoha-ponctl 装成 package/feeds/packages/airoha-ponctl,
        # 所以基准目录是 package/feeds/packages, 不是 package/feeds/packages/pon。
        BASE=package/feeds/packages
        if [ ! -d "$BASE" ]; then
          echo "::error::没有 $BASE, feeds install 可能没跑"
          exit 1
        fi
        PON_PKGS="airoha-pon-daemons airoha-pon-debug airoha-pon-frontends airoha-ponctl airoha-xpon luci-app-pon luci-app-iptv"
        echo "===== 去重前 ====="
        for f in packages pon_drivers pon_userspace; do
          [ -d "package/feeds/$f" ] && { echo "  [$f]"; ls -1 "package/feeds/$f" 2>/dev/null | sed 's/^/    /'; }
        done
        removed=0
        for p in $PON_PKGS; do
          if [ ! -e "$BASE/$p" ]; then
            echo "  ⚠️  LEDE packages 里没有 $p, 跳过"
            continue
          fi
          for other in "package/feeds/pon_drivers/$p" "package/feeds/pon_userspace/$p"; do
            if [ -e "$other" ]; then
              echo "  去掉重复: $p  ($other, 保留 $BASE/$p)"
              rm -rf "$other"
              removed=$((removed + 1))
            fi
          done
        done
        echo "  共去掉 $removed 个重复包"
        echo "===== 去重后 pon 相关包 ====="
        for f in packages pon_drivers pon_userspace; do
          [ -d "package/feeds/$f" ] && { echo "  [$f]"; ls -1 "package/feeds/$f" 2>/dev/null | sed 's/^/    /'; }
        done
        # 断言: 这批包名在 package/feeds 下必须唯一
        for p in airoha-pond airoha-ponctl airoha-pon-daemons airoha-pon-debug airoha-pon-frontends airoha-xpon luci-app-onu luci-app-pon luci-app-pon-status luci-app-iptv; do
          n=$(find package/feeds -maxdepth 2 -mindepth 2 -name "$p" 2>/dev/null | wc -l)
          if [ "$n" -gt 1 ]; then
            echo "::error::包 $p 仍存在 $n 份:"
            find package/feeds -maxdepth 2 -mindepth 2 -name "$p" | sed 's/^/    /'
            exit 1
          fi
        done
        echo "✅ pon 相关包名已唯一"
        # 关键包必须落在 LEDE packages 下
        for p in airoha-pon-daemons airoha-ponctl airoha-xpon; do
          [ -e "$BASE/$p" ] || { echo "::error::LEDE packages 缺少 $p"; exit 1; }
        done
        # luci-app-pon-status 必须还在 pon_userspace 下 (packages 里没有)
        # luci-app-onu 已不再选用 (与原生 luci-app-pon 文件冲突), 故不再断言
        for p in luci-app-pon-status; do
          [ -e "package/feeds/pon_userspace/$p" ] || { echo "::error::pon_userspace 缺少 $p"; exit 1; }
        done
        echo "✅ airoha-pon-daemons / airoha-ponctl / airoha-xpon 均来自 LEDE packages"

    - name: Load custom configuration
      run: |
        cd openwrt
        # LEDE 没有官方 an7581 基线，从空白 .config 开始：
        #   种子（目标 + 要显式选的包）→ make defconfig 按 LEDE 默认值补齐
        : > .config
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        make defconfig
        # 设备符号兜底：万一 MULTI_PROFILE 模式生效，换成多 profile 符号再来一遍
        DEVSYM='CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi'
        if ! grep -qE "^${DEVSYM}=y" .config; then
          echo "⚠️  单 profile 设备符号没选中，尝试多 profile 符号"
          echo 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' >> .config
          make defconfig
        fi
        echo "===== 目标相关行 ====="
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|MULTI_PROFILE)=|^CONFIG_TARGET_airoha' .config | head -10
        grep -E 'nokia_xg-040g-md-ubi=y$' .config || true
        # ---- ccache: 编译器对象缓存, 跨构建复用已编译的 .o ----
        # LEDE 的 Config.in / Config-build.in 里都没有 "config CCACHE" 这个符号
        # (实测两轮都是 warning), 探测式永远开不起来。rules.mk 判的是 make 变量
        # CONFIG_CCACHE, 所以直接写进 .config 即可 —— 但不能紧跟着 make defconfig,
        # kconfig 认不得这个符号, 会把它从 .config 里清掉。
        # 可用性由后面的 Handle toolchain 负责校验: host ccache 起不来就删掉这行并回退。
        if ! grep -q '^CONFIG_CCACHE=y' .config; then
          echo 'CONFIG_CCACHE=y' >> .config
        fi
        if grep -q '^CONFIG_CCACHE=y' .config; then
          echo "✅ CONFIG_CCACHE 已写入 .config（host ccache 在工具链阶段校验）"
        else
          echo "::warning::CONFIG_CCACHE 未生效，本次不使用 ccache（不影响构建）"
        fi

    - name: Verify target device
      run: |
        cd openwrt
        BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUB=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
        DEV=$(grep -oE '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia[^=]*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/')
        [ -n "$DEV" ] || DEV=$(grep -oE '^CONFIG_TARGET_airoha_an7581_DEVICE_nokia[^=]*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/')
        echo "board=$BOARD subtarget=$SUB device=$DEV"
        if [ "$BOARD" != "airoha" ] || [ "$SUB" != "an7581" ]; then
          echo "❌ 目标不符: 期望 airoha/an7581, 实际 $BOARD/$SUB"; exit 1
        fi
        if [ "$DEV" != "nokia_xg-040g-md-ubi" ]; then
          echo "❌ 设备不符: 期望 nokia_xg-040g-md-ubi, 实际 '$DEV'"
          grep -E 'nokia' .config || true
          exit 1
        fi
        echo "✅ 目标校验通过: airoha/an7581/$DEV"

    - name: Verify PON / 2.5G / accel (lede lite)
      run: |
        cd openwrt
        ok=1
        need() {
          if grep -qE "^$1=[ym]$" .config; then echo "✅ $1";
          else echo "❌ 缺少 $1"; ok=0; fi
        }
        needy() {
          if grep -qE "^$1=y$" .config; then echo "✅ $1=y";
          else echo "❌ $1 不是 =y（当前: $(grep -E "^$1=" .config || echo '未出现')）"; ok=0; fi
        }
        absent() {
          if grep -qE "^$1=[ym]$" .config; then
            echo "❌ 纯净版不应包含 $1（当前: $(grep -E "^$1=" .config)）"; ok=0
          else
            echo "✅ 已排除 $1"
          fi
        }
        echo "----- PON 驱动栈 / 光模块驱动（强制 =y）-----"
        needy CONFIG_PACKAGE_kmod-airoha-xpon
        needy CONFIG_PACKAGE_kmod-airoha-pon-frontend
        needy CONFIG_PACKAGE_kmod-airoha-en7572
        needy CONFIG_PACKAGE_airoha-pond
        needy CONFIG_PACKAGE_airoha-ponctl
        echo "----- 2.5G 网口 PHY EN8811H（强制 =y）-----"
        needy CONFIG_PACKAGE_kmod-phy-airoha-en8811h
        needy CONFIG_PACKAGE_airoha-en8811h-firmware
        echo "----- 硬件加速 (L2 桥接 / L3) -----"
        need CONFIG_PACKAGE_kmod-nft-offload
        need CONFIG_PACKAGE_kmod-nf-flow
        need CONFIG_PACKAGE_kmod-nft-bridge
        for sym in CONFIG_BRIDGE_NETFILTER CONFIG_NF_CONNTRACK_BRIDGE; do
          if grep -qE "^${sym}=y" target/linux/airoha/an7581/config-6.18; then
            echo "✅ ${sym}=y (LEDE 无 kmod 包，走内核内置)"
          else
            echo "❌ ${sym} 未在 config-6.18 中打开（bridge flowtable 无法生成硬件条目）"; ok=0
          fi
        done
        echo "----- 内核开关: 每流统计 -----"
        if grep -qE '^CONFIG_NET_AIROHA_FLOW_STATS=y' target/linux/airoha/an7581/config-6.18; then
          echo "✅ CONFIG_NET_AIROHA_FLOW_STATS=y (config-6.18 已改写)"
        else
          echo "❌ CONFIG_NET_AIROHA_FLOW_STATS 未在 config-6.18 中打开"; ok=0
        fi
        echo "----- 拨号 / 基础路由（必须存在）-----"
        need CONFIG_PACKAGE_ppp
        need CONFIG_PACKAGE_ppp-mod-pppoe
        need CONFIG_PACKAGE_luci-proto-ppp
        need CONFIG_PACKAGE_luci-proto-ipv6
        need CONFIG_PACKAGE_dnsmasq-full
        need CONFIG_PACKAGE_odhcp6c
        need CONFIG_PACKAGE_luci-app-firewall
        echo "----- 基础管理界面 -----"
        need CONFIG_PACKAGE_luci
        need CONFIG_PACKAGE_luci-app-pon
        need CONFIG_PACKAGE_luci-app-pon-status
        # 互斥检查: luci-app-onu 与原生 luci-app-pon 装同一批文件, 同选必炸
        if grep -q '^CONFIG_PACKAGE_luci-app-onu=y' .config && grep -q '^CONFIG_PACKAGE_luci-app-pon=y' .config; then
          echo "❌ luci-app-onu 与 luci-app-pon 同时选中, check_data_file_clashes 必失败"; ok=0
        fi
        need CONFIG_PACKAGE_luci-theme-bootstrap
        echo "----- 纯净版排除项（代理插件 / lean 插件 / OAF / mosdns / NPU 面板）-----"
        for p in luci-app-ssr-plus luci-app-passwall luci-app-passwall2 luci-app-openclash \
                 luci-app-bypass luci-app-vssr luci-app-turboacc luci-app-upnp luci-app-ddns \
                 luci-app-vsftpd luci-app-filetransfer luci-app-vlmcsd luci-app-wol \
                 luci-app-arpbind luci-app-accesscontrol luci-app-nlbwmon luci-app-autoreboot \
                 xray-core v2ray-core coremark kmod-tun kmod-ipt-raw iptables-mod-tproxy; do
          absent "CONFIG_PACKAGE_$p"
        done
        absent CONFIG_PACKAGE_luci-theme-argon
        absent CONFIG_PACKAGE_kmod-oaf
        absent CONFIG_PACKAGE_appfilter
        absent CONFIG_PACKAGE_luci-app-oaf
        absent CONFIG_PACKAGE_mosdns
        absent CONFIG_PACKAGE_luci-app-mosdns
        absent CONFIG_PACKAGE_luci-app-airoha-npu
        echo "----- 默认包清单 / feeds 层面已剔除第三方插件 -----"
        if grep -qE '^[[:space:]]*src-git helloworld ' feeds.conf.default 2>/dev/null; then
          echo "❌ feeds.conf.default 仍启用 helloworld（ssr-plus/passwall 来源）"; ok=0
        else
          echo "✅ helloworld feed 已关闭"
        fi
        if grep -qE 'luci-app-(ssr-plus|passwall|openclash|bypass|vssr)' include/target.mk; then
          echo "❌ include/target.mk 的 DEFAULT_PACKAGES 仍含第三方插件"
          grep -nE 'luci-app-(ssr-plus|passwall|openclash|bypass|vssr)' include/target.mk | sed 's/^/   /'
          ok=0
        else
          echo "✅ include/target.mk 默认包已白名单化（只剩拨号 + 基础路由）"
        fi
        echo "   默认包清单:"
        sed -n '/^DEFAULT_PACKAGES\.router:=/,/[^\\]$/p' include/target.mk | tr -s ' \t' ' ' | sed 's/^/     /'
        echo "----- feed 依赖：不得指向 LEDE 不存在的 kmod -----"
        # run #3 就是死在这里：luci-app-onu 的 LUCI_DEPENDS 带 +kmod-nf-conntrack-bridge，
        # 而 LEDE 的 package/kernel/linux/modules/netfilter.mk 里没有这个 KernelPackage，
        # 元数据阶段只给一条 WARNING，真正炸在 make package/install。
        # diy-lede-lite-2.sh 会在 feeds install 之前把这类依赖剔掉，这里再兜底扫一遍。
        KMODS=$(grep -rhoE 'define[[:space:]]+KernelPackage/[A-Za-z0-9._-]+' package target/linux feeds 2>/dev/null \
                | sed 's|.*KernelPackage/|kmod-|' | sort -u) || true
        echo "   LEDE 可用的 kmod 包: $(printf '%s\n' "$KMODS" | grep -c . ) 个"
        miss=0
        for mk in package/feeds/pon_*/*/Makefile; do
          [ -f "$mk" ] || continue
          for k in $(grep -oE '\+kmod-[A-Za-z0-9._-]+' "$mk" | tr -d '+' | sort -u || true); do
            if ! printf '%s\n' "$KMODS" | grep -qx -- "$k"; then
              echo "❌ $mk 依赖不存在的 $k"; miss=1
            fi
          done
        done
        if [ "$miss" = "1" ]; then
          ok=0
        else
          echo "✅ PON feed 的 kmod 依赖全部可满足"
        fi
        echo "----- dummy 接口已排除 -----"
        if grep -qE '^CONFIG_PACKAGE_kmod-dummy=[ym]' .config; then
          echo "❌ kmod-dummy 仍被选中"; ok=0
        else
          echo "✅ kmod-dummy 未选中"
        fi
        echo "----- 出厂默认值（构建期写入源码树，不依赖仓库 files/）-----"
        if grep -qE '^root:[^:]+:' package/base-files/files/etc/shadow; then
          echo "✅ root 密码已设置（$(grep -m1 '^root:' package/base-files/files/etc/shadow | cut -c6-9)... 哈希）"
        else
          echo "❌ root 密码未设置"; ok=0
        fi
        if [ -f package/base-files/files/etc/uci-defaults/99-lede-lite-bridge ]; then
          echo "✅ 首启默认值 uci-defaults/99-lede-lite-bridge 已生成"
          grep -q "flow_offloading_hw='1'" package/base-files/files/etc/uci-defaults/99-lede-lite-bridge \
            && echo "   → flow_offloading_hw=1" || { echo "❌ uci-defaults 未打开硬件加速"; ok=0; }
        else
          echo "❌ 缺少 uci-defaults/99-lede-lite-bridge"; ok=0
        fi
        echo "----- 未引用仓库 files/ -----"
        if [ -d files ] && [ "$(ls -A files 2>/dev/null)" ]; then
          echo "⚠️  openwrt/files 非空"
          ls -R files | head -20
        else
          echo "✅ openwrt/files 为空，固件不含仓库覆盖层"
        fi
        if [ "$ok" != "1" ]; then echo "❌ 校验失败, 终止编译"; exit 1; fi
        echo "✅ 全部校验通过"

    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
        echo "CACHE_KEY=toolchain-lede-an7581-${TOOLS_HASH:0:16}" >> $GITHUB_OUTPUT
        echo "CACHE_PREFIX=toolchain-lede-an7581" >> $GITHUB_OUTPUT
        echo "缓存键: toolchain-lede-an7581-${TOOLS_HASH:0:16}"
        # ---- 二次利用: dl 源码包 + ccache 的缓存键 ----
        # dl 按月轮转 / ccache 按 ISO 周轮转: 同周期内精确命中即不重复保存,
        # 避免每次构建都写一条新缓存把 10GB 配额挤爆、反过来淘汰工具链缓存。
        echo "CACHE_TAG=lede-an7581" >> $GITHUB_OUTPUT
        echo "DL_KEY=dl-lede-an7581-$(date -u +%Y%m)" >> $GITHUB_OUTPUT
        echo "CC_KEY=ccache-lede-an7581-$(date -u +%G-W%V)" >> $GITHUB_OUTPUT
        echo "dl 键: dl-lede-an7581-$(date -u +%Y%m)  ccache 键: ccache-lede-an7581-$(date -u +%G-W%V)"

    - name: Restore toolchain (actions/cache)
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Restore toolchain (Release backup)
      if: steps.cache-restore.outputs.cache-hit != 'true'
      id: release-restore
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        ASSET="${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "toolchain-cache 不存在, 首次运行"
          exit 0
        fi
        if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
          gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D .
          if [ -e "$ASSET" ]; then
            tar -I unzstd -xf "$ASSET" || tar -xf "$ASSET"
            rm -f "$ASSET"
            echo "restored=true" >> $GITHUB_OUTPUT
            echo "Release 工具链恢复成功"
          else
            echo "restored=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "Release 中无该缓存: $ASSET"
        fi

    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt
        if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
          echo "actions/cache 命中, 跳过工具链编译"
          echo "save_cache=false" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        elif [ "${{ steps.release-restore.outputs.restored }}" = "true" ]; then
          echo "Release 缓存命中, 回写 actions/cache"
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        else
          echo "无缓存, 开始编译工具链..."
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=true" >> $GITHUB_OUTPUT
        fi
        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile
        echo "Makefile 已修改: 后续跳过工具链重编译"
        # ---- ccache: 确保 ccache 可用, 否则回退关闭, 避免编译期 command not found ----
        # 关键: rules.mk 里是 TARGET_CC := ccache $(TARGET_CC), 用的是 PATH 上的 ccache,
        # 并不要求 staging_dir/host/bin/ccache 存在。上一版只查 staging 目录,
        # 于是 apt 装好的 /usr/bin/ccache 明明可用也被判"不可用", CONFIG_CCACHE 被白删。
        if grep -q '^CONFIG_CCACHE=y' .config 2>/dev/null; then
          CCB=$(command -v ccache 2>/dev/null || true)
          if [ -z "$CCB" ] || [ ! -x "$CCB" ]; then
            CCB=""
            if [ -x staging_dir/host/bin/ccache ]; then CCB="$PWD/staging_dir/host/bin/ccache"; fi
          fi
          if [ -z "$CCB" ]; then
            echo "PATH 和 staging_dir/host/bin 都没有 ccache, 尝试补编..."
            make tools/ccache/install -j$(nproc) >/dev/null 2>&1 || true
            if [ -x staging_dir/host/bin/ccache ]; then CCB="$PWD/staging_dir/host/bin/ccache"; fi
          fi
          if [ -n "$CCB" ]; then
            # rules.mk 里 CCACHE_DIR 默认 $(TOPDIR)/.ccache, 与 actions/cache 的路径一致
            export CCACHE_DIR="$PWD/.ccache"
            mkdir -p "$CCACHE_DIR"
            "$CCB" --max-size=1G >/dev/null 2>&1 || true
            echo "✅ ccache 可用: $CCB"
            "$CCB" --version | head -1 || true
            "$CCB" -s | head -8 || true
          else
            echo "::warning::ccache 不可用, 回退关闭 CONFIG_CCACHE"
            sed -i '/^CONFIG_CCACHE/d' .config
            echo '# CONFIG_CCACHE is not set' >> .config
            make defconfig
          fi
        fi

    - name: Save toolchain (actions/cache)
      uses: actions/cache/save@v4
      if: steps.toolchain.outputs.save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Save toolchain (Release backup)
      if: steps.toolchain.outputs.save_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"
        tar -I zstdmt -cf "${KEY}.tzst" staging_dir/host* staging_dir/tool*
        ls -lh "${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" --title "Toolchain Cache" --notes "自动生成的工具链缓存, 请勿删除" --latest=false
        fi
        gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep "^${PREFIX}" | while read -r old; do
          echo "删除旧缓存: $old"
          gh release delete-asset toolchain-cache "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
        done
        gh release upload toolchain-cache "${KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
        rm -f "${KEY}.tzst"

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true'

    - name: Restore dl cache (源码包)
      uses: actions/cache@v4
      id: dl-cache
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.cache-key.outputs.DL_KEY }}
        restore-keys: |
          dl-lede-an7581-

    - name: Restore ccache (编译对象缓存)
      uses: actions/cache@v4
      id: ccache-cache
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ steps.cache-key.outputs.CC_KEY }}
        restore-keys: |
          ccache-lede-an7581-

    - name: Report cache state
      run: |
        cd openwrt
        echo "dl 命中: ${{ steps.dl-cache.outputs.cache-hit }} / ccache 命中: ${{ steps.ccache-cache.outputs.cache-hit }}"
        du -sh dl 2>/dev/null || echo "dl 尚不存在"
        du -sh .ccache 2>/dev/null || echo ".ccache 尚不存在"
        df -hT / | tail -1

    - name: Download package
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        df -hT /
        # 原写法 make -j || make -j1 || make -j1 V=s: 磁盘写满时也会重试两次, 白耗十几分钟
        set +e
        make -j$(nproc) 2>&1 | tee /tmp/build.log
        rc=${PIPESTATUS[0]}
        set -e
        if [ "$rc" -ne 0 ]; then
          if grep -qE 'No space left on device|running out of disk space' /tmp/build.log; then
            echo "::error::磁盘写满 (ENOSPC), 编译中断; 重试只会继续失败"
            df -hT /
            exit 1
          fi
          # -j 的 trace 输出会把真正的错误行淹没甚至丢失 (本次 run 41382279829 就是
          # 卡在 package/install 却一行错误都没有), 必须用 -j1 V=s 重跑才能拿到原因
          echo "::warning::首次编译失败 (非磁盘原因), 用 -j1 V=s 抓详细错误"
          set +e
          make -j1 V=s > /tmp/build2.log 2>&1
          rc=$?
          set -e
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::编译失败"
          echo "===== 关键错误行 ====="
          grep -nE '(^|[[:space:]])(ERROR:|Error [0-9]+|error:|\*\*\* |No such file|Cannot |command not found)' /tmp/build2.log 2>/dev/null | tail -40 || true
          echo "===== package/install 上下文 ====="
          grep -n -A25 'package/install' /tmp/build2.log 2>/dev/null | tail -60 || true
          echo "===== opkg 安装错误上下文 ====="
          grep -nE 'opkg|Installing |Cannot install|depends on|not available|unknown package|No feed for package|check_data_file_clashes' /tmp/build2.log 2>/dev/null | tail -60 || true
          echo "===== package/install 起始行 ====="
          grep -n 'package/install' /tmp/build2.log 2>/dev/null | head -3 || true
          echo "===== PON/ONU 相关 ipk 产物 ====="
          find bin/packages -name '*.ipk' 2>/dev/null | grep -Ei 'onu|airoha|/pon/' | sed 's|.*/||' | sort || true
          echo "===== .config 中相关开关 ====="
          grep -E '^CONFIG_PACKAGE_(airoha|luci-app-onu|luci-i18n-onu|ip-full|kmod-airoha)' .config 2>/dev/null || true
          echo "===== 末尾 120 行 ====="
          tail -120 /tmp/build2.log 2>/dev/null || tail -120 /tmp/build.log
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-lede-lite
        path: |
          /tmp/build.log
          /tmp/build2.log
        if-no-files-found: ignore
        retention-days: 3

    - name: Verify built kernel config
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        KCFG=$(ls -d build_dir/target-*/linux-airoha_an7581/linux-*/.config 2>/dev/null | head -1)
        echo "kernel config: $KCFG"
        if [ -n "$KCFG" ]; then
          for sym in CONFIG_NET_AIROHA_FLOW_STATS CONFIG_NET_AIROHA CONFIG_NF_FLOW_TABLE CONFIG_NFT_FLOW_OFFLOAD; do
            echo "$(grep -E "^${sym}=" "$KCFG" || echo "$sym <未设置>")"
          done
          grep -qE '^CONFIG_NET_AIROHA_FLOW_STATS=y' "$KCFG" \
            && echo "✅ 内核已编入每流统计" \
            || echo "⚠️  CONFIG_NET_AIROHA_FLOW_STATS 未生效(检查 Kconfig 依赖)"
        fi
        echo "===== 镜像体积（纯净版应明显小于标准版）====="
        ls -lh bin/targets/airoha/an7581/*.itb bin/targets/airoha/an7581/*.bin 2>/dev/null || true

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=${DEVICE_NAME}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT
        {
          echo "## 040G-MD 纯净版固件 (LEDE 源码)"
          echo ""
          echo "| 项目 | 详情 |"
          echo "|------|------|"
          echo "| 源码 | $REPO_URL ($REPO_BRANCH) |"
          echo "| 设备 | airoha/an7581 / nokia_xg-040g-md-ubi |"
          echo "| 定位 | 纯净版: 光口 + 拨号 + 硬件加速转发，无任何第三方插件 |"
          echo "| 拨号 | ppp / ppp-mod-pppoe / luci-proto-ppp（PPPoE 拨号）|"
          echo "| 硬件加速 | fw4 flowtable(L2+L3) + PPE, 默认 flow_offloading=1 |"
          echo "| 每流统计 | CONFIG_NET_AIROHA_FLOW_STATS=y |"
          echo "| PON | airoha-xpon + pon-frontend + en7572 (pbs05 feeds) |"
          echo "| 2.5G | phy-airoha-en8811h (lan1) |"
          echo "| 主题 | luci-theme-bootstrap（不含 argon）|"
          echo "| 已排除 | ssr-plus / passwall / openclash / turboacc / upnp / ddns / argon / OAF / mosdns / NPU 面板 |"
          echo "| 出厂配置 | 不含仓库 files/ 覆盖层，默认 root 密码 \`admin123\` |"
          echo "| 时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |"
        } > release.txt

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.itb
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
        delete_tag_pattern: '^lede-lite-040g-md-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
